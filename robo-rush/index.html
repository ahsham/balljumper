<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robo Rush</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;color:#192541;background:#91d9ff}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:manipulation}.hud{position:fixed;inset:0 0 auto;display:flex;justify-content:space-between;padding:12px;font-weight:850;pointer-events:none}.pile{display:flex;gap:7px;align-items:start;flex-wrap:wrap}.chip{background:#ffffffe3;border-radius:99px;padding:7px 10px;box-shadow:0 5px 15px #17467125}.bar{width:min(26vw,180px);height:12px;margin-top:8px;border-radius:99px;background:#ffffffb8;overflow:hidden}.bar i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#79d8ff,#ff536f)}.screen{position:fixed;inset:0;display:grid;place-items:center;padding:18px;background:#17335c28;backdrop-filter:blur(2px)}.hide{display:none}.card{width:min(500px,94vw);text-align:center;background:#fffffff2;border-radius:27px;padding:25px;box-shadow:0 22px 60px #17345a45}.card h1{font-size:clamp(38px,9vw,60px);letter-spacing:-3px;line-height:.83;margin:0 0 15px}.card p{line-height:1.45;color:#4d5b72}.tips{display:grid;grid-template-columns:28px 1fr;gap:8px;text-align:left;background:#edf8ff;padding:14px;border-radius:17px;margin:18px 0}.buttons{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button{border:0;border-radius:14px;background:#e7f2f7;color:#1b2944;padding:12px 16px;font:800 16px inherit;cursor:pointer;box-shadow:inset 0 -3px #0001}button.main{background:linear-gradient(135deg,#ff4f85,#ff825b);color:#fff;font-size:19px}.note{font-size:13px}.toast{position:fixed;top:75px;left:50%;translate:-50% -8px;background:#192541e9;color:#fff;border-radius:99px;padding:8px 14px;font-weight:800;opacity:0;transition:.18s;pointer-events:none}.toast.on{opacity:1;translate:-50% 0}@media(max-width:600px){.hud{padding:8px}.chip{font-size:13px;padding:5px 8px}.bar{width:115px}.card{padding:21px 16px}}
</style></head><body>
<canvas id="c"></canvas><div class="hud"><div class="pile"><span class="chip" id="score">0</span><span class="chip" id="best">Best 0</span><span class="chip" id="mult">x1</span></div><div class="pile"><span class="chip" id="parts">⚙ 0</span><div><span class="chip" id="status">🧹 VACUUM</span><div class="bar"><i id="danger"></i></div></div></div></div><div class="toast" id="toast"></div>
<section class="screen" id="menu"><main class="card"><h1>ROBO<br>RUSH</h1><p>A runaway ball. A very determined robo-vac. Roll as far as you can before it catches you.</p><div class="tips"><span>🟠</span><div><b>Tap / Space</b> to jump. Clear obstacles to build a streak.</div><span>⚡</span><div>Turbo sparks make you fly.</div><span>🧲</span><div>Magnets pull in nearby parts.</div></div><div class="buttons"><button class="main" id="play">▶ Run!</button><button id="skin">🎨 Ball look</button></div><p class="note" id="shop"></p></main></section>
<section class="screen hide" id="over"><main class="card"><h1 id="caught">CAUGHT!</h1><p id="summary"></p><div class="buttons"><button class="main" id="again">↻ Again</button><button id="skin2">🎨 Ball look</button></div><p class="note">Instant restart. Go one meter farther.</p></main></section>
<script>
const c=document.querySelector('#c'),g=c.getContext('2d'),$=q=>document.querySelector(q);let W,H,d,ground,last=0;function resize(){d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0);ground=H*.78}addEventListener('resize',resize);resize();
const save={get:(k,n=0)=>+localStorage.getItem('roborush_'+k)||n,set:(k,v)=>localStorage.setItem('roborush_'+k,v)};let parts=save.get('parts'),best=save.get('best'),skin=save.get('skin'),unlocked=Math.max(1,save.get('unlocked',1));const looks=[['Bubblegum','#ffd0df','#ff4f85'],['Ocean Pop','#c7f6ff','#288fe4'],['Lemon Zap','#fff5ad','#e1b220'],['Grape Jam','#ebd2ff','#984ed2']];
let state='menu',world=0,speed=250,score=0,combo=0,comboT=0,threat=0,turbo=0,magnet=0,spawn=320,shake=0,items=[],sparks=[];const ball={x:150,y:0,vy:0,r:23,land:true,squash:0,roll:0};const E={score:$('#score'),best:$('#best'),mult:$('#mult'),parts:$('#parts'),status:$('#status'),danger:$('#danger'),toast:$('#toast')};
function toast(s){E.toast.textContent=s;E.toast.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>E.toast.classList.remove('on'),1150)}function hud(){E.score.textContent=Math.floor(score).toLocaleString();E.best.textContent='Best '+best.toLocaleString();E.mult.textContent='Streak x'+(1+Math.floor(combo/4));E.parts.textContent='⚙ '+parts;E.danger.style.width=Math.max(0,100-threat)+'%';E.status.textContent=threat>70?'🌀 VACUUM CLOSE!':'🧹 VACUUM'}
function setShop(){let s=unlocked<looks.length?`Unlock a new ball look — 25 ⚙ (${unlocked}/${looks.length})`:'All ball looks unlocked — choose one!';$('#shop').textContent=s;let b=unlocked<looks.length?'🎨 Unlock (25 ⚙)':'🎨 Change look';$('#skin').textContent=b;$('#skin2').textContent=b}function shop(){if(unlocked<looks.length){if(parts<25)return toast(`Need ${25-parts} more ⚙`);parts-=25;unlocked++;skin=unlocked-1;save.set('parts',parts);save.set('unlocked',unlocked);save.set('skin',skin);toast('New look: '+looks[skin][0]+'!')}else{skin=(skin+1)%looks.length;save.set('skin',skin);toast(looks[skin][0])}setShop();hud()}
function start(){state='play';$('#menu').classList.add('hide');$('#over').classList.add('hide');world=0;speed=250;score=0;combo=0;comboT=0;threat=0;turbo=0;magnet=0;spawn=330;shake=0;items=[];sparks=[];ball.y=ground-ball.r;ball.vy=0;ball.land=true;ball.squash=0;last=performance.now();hud()}function end(){state='over';best=Math.max(best,Math.floor(score));save.set('best',best);$('#caught').textContent=world>best*.7?'SO CLOSE!':'CAUGHT!';$('#summary').textContent=`${Math.floor(world)}m rolled · ${Math.floor(score).toLocaleString()} score · streak x${1+Math.floor(combo/4)}`;$('#over').classList.remove('hide');hud()}
function jump(){if(state!=='play')return start();if(ball.land){ball.vy=-735;ball.land=false;ball.squash=.2;tone(570,.07)}}function tone(f,t=.06){try{let a=new AudioContext,o=a.createOscillator,v=a.createGain();o.frequency.value=f;v.gain.setValueAtTime(.05,a.currentTime);v.gain.exponentialRampToValueAtTime(.001,a.currentTime+t);o.connect(v).connect(a.destination);o.start();o.stop(a.currentTime+t)}catch{}}
function burst(x,y,n,col){for(let i=0;i<n;i++)sparks.push({x,y,vx:(Math.random()-.5)*220,vy:-Math.random()*160,life:.45,max:.45,s:2+Math.random()*3,col})}function make(){let r=Math.random(),kind=r<.58?'block':r<.79?'part':r<.9?'turbo':'magnet';let o={kind,x:world+W+65};if(kind==='block'){o.w=30+Math.random()*28;o.h=32+Math.random()*57;o.done=false}else{o.y=ground-80-Math.random()*90;o.r=kind==='part'?10:14}items.push(o)}
function update(dt){speed=Math.min(640,speed+3.5*dt);turbo=Math.max(0,turbo-dt);magnet=Math.max(0,magnet-dt);comboT-=dt;if(comboT<0)combo=0;let run=speed*(turbo?1.55:1);world+=run*dt;score+=run*dt*.11*(1+Math.floor(combo/4)*.25);threat=Math.max(0,threat-dt*(turbo?15:4));spawn-=run*dt;if(spawn<0){make();spawn=190+Math.random()*225-Math.min(80,world*.012)}ball.vy+=2050*dt;ball.y+=ball.vy*dt;if(ball.y+ball.r>=ground){if(!ball.land&&ball.vy>180){ball.squash=Math.min(.55,ball.vy/1400);burst(ball.x,ground,7,'#53c970')}ball.y=ground-ball.r;ball.vy=0;ball.land=true}else ball.land=false;ball.squash=Math.max(0,ball.squash-3.4*dt);ball.roll+=(ball.land?run/ball.r:ball.vy/ball.r*.2)*dt;
for(let i=items.length-1;i>=0;i--){let o=items[i],sx=o.x-world+ball.x;if(o.kind==='block'){if(!o.done&&sx+o.w<ball.x){o.done=true;if(!ball.land){combo++;comboT=2.1;score+=80*(1+Math.floor(combo/4));burst(sx+o.w,ground-o.h,5,'#fff3a0');if(combo%4===0)toast('Streak x'+(1+Math.floor(combo/4))+'!')}else threat=Math.min(100,threat+11)}let hit=sx<ball.x+ball.r&&sx+o.w>ball.x-ball.r&&ball.y+ball.r>ground-o.h;if(hit&&!o.hit){o.hit=true;threat=Math.min(100,threat+34);combo=0;shake=9;burst(ball.x,ball.y,12,'#ff6469');tone(110,.14)}}else{let dx=sx-ball.x,dy=o.y-ball.y;if(magnet&&Math.hypot(dx,dy)<160){o.x-=dx*dt*5;o.y-=dy*dt*5}if(dx*dx+dy*dy<(ball.r+o.r)**2){items.splice(i,1);if(o.kind==='part'){parts++;save.set('parts',parts);score+=35;tone(910,.04)}if(o.kind==='turbo'){turbo=3;toast('⚡ TURBO!');tone(1050,.1)}if(o.kind==='magnet'){magnet=5;toast('🧲 PART MAGNET!');tone(720,.1)}continue}}if(sx<-100)items.splice(i,1)}if(threat>=100)end();for(let i=sparks.length-1;i>=0;i--){let s=sparks[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=600*dt;s.life-=dt;if(s.life<0)sparks.splice(i,1)}hud()}
function background(){let sky=g.createLinearGradient(0,0,0,ground);sky.addColorStop(0,'#81d1ff');sky.addColorStop(1,'#effcff');g.fillStyle=sky;g.fillRect(0,0,W,H);g.fillStyle='#ffffff75';for(let i=-1;i<5;i++){let X=i*270-world*.12%270,Y=80+(i%3)*50;g.beginPath();g.arc(X,Y,24,0,7);g.arc(X+32,Y-13,34,0,7);g.arc(X+70,Y,22,0,7);g.fill()}g.fillStyle='#7bda70';for(let i=-2;i<5;i++){let X=i*W/2-world*.3%(W/2);g.beginPath();g.arc(X+W/4,ground-60,145,Math.PI,0);g.rect(X,ground-60,W/2,H);g.fill()}g.fillStyle='#36b968';g.fillRect(0,ground,W,H-ground);g.fillStyle='#1e9e52';g.fillRect(0,ground-7,W,7)}
function vacuum(){let gap=110+threat*1.16,X=Math.max(-65,ball.x-gap),Y=ground-22;g.save();g.globalAlpha=.22+threat*.005;g.fillStyle='#9aeaff';g.beginPath();g.moveTo(X+27,Y-13);g.lineTo(ball.x,ball.y-16);g.lineTo(ball.x,ball.y+16);g.closePath();g.fill();g.globalAlpha=1;g.fillStyle='#202b3a';g.beginPath();g.ellipse(X,Y,31,19,0,0,7);g.fill();g.fillStyle='#92a8b4';g.beginPath();g.ellipse(X,Y-3,29,17,0,0,7);g.fill();g.strokeStyle='#283b46';g.lineWidth=3;g.stroke();g.fillStyle='#25303c';g.beginPath();g.arc(X-5,Y-4,9,0,7);g.fill();g.fillStyle=threat>70?'#ff4e68':'#79efff';g.beginPath();g.arc(X-5,Y-4,4,0,7);g.fill();g.fillStyle='#283c47';g.fillRect(X+23,Y-8,18,16);g.restore()}
function draw(){g.save();if(shake){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.82}background();vacuum();for(let o of items){let X=o.x-world+ball.x;if(o.kind==='block'){g.fillStyle='#df5965';g.fillRect(X,ground-o.h,o.w,o.h);g.fillStyle='#ff9991';g.fillRect(X+4,ground-o.h+4,o.w-8,6);g.strokeStyle='#983444';g.strokeRect(X,ground-o.h,o.w,o.h)}else{g.save();g.translate(X,o.y);let q=1+Math.sin(performance.now()/110+o.x)*.08;g.scale(q,q);if(o.kind==='part'){g.fillStyle='#ffd543';g.beginPath();g.arc(0,0,o.r,0,7);g.fill();g.fillStyle='#9a6900';g.fillRect(-2,-6,4,12)}if(o.kind==='turbo'){g.fillStyle='#ffe85a';g.beginPath();g.moveTo(-7,-15);g.lineTo(4,-3);g.lineTo(0,-3);g.lineTo(8,15);g.lineTo(-5,2);g.lineTo(-1,2);g.closePath();g.fill()}if(o.kind==='magnet'){g.strokeStyle='#f34a69';g.lineWidth=6;g.beginPath();g.arc(0,2,10,0,Math.PI);g.stroke();g.fillStyle='#fff';g.fillRect(-13,0,7,6);g.fillRect(6,0,7,6)}g.restore()}}for(let s of sparks){g.globalAlpha=s.life/s.max;g.fillStyle=s.col;g.beginPath();g.arc(s.x,s.y,s.s,0,7);g.fill()}g.globalAlpha=1;let L=looks[skin];g.save();g.translate(ball.x,ball.y);g.scale(1+ball.squash*.45,1-ball.squash*.35);let grad=g.createRadialGradient(-8,-11,2,0,0,ball.r);grad.addColorStop(0,L[1]);grad.addColorStop(1,L[2]);g.fillStyle=grad;g.beginPath();g.arc(0,0,ball.r,0,7);g.fill();g.fillStyle='#ffffff8c';g.beginPath();g.ellipse(-8,-10,8,5,-.4,0,7);g.fill();g.fillStyle='#202039';g.beginPath();g.arc(-7,-4,3.5,0,7);g.arc(7,-4,3.5,0,7);g.fill();g.restore();g.save();g.translate(ball.x,ball.y);g.rotate(ball.roll);g.strokeStyle=L[2]+'88';g.lineWidth=2;g.lineCap='round';for(let i=0;i<3;i++){g.rotate(2.1);g.beginPath();g.moveTo(12,0);g.lineTo(17,4);g.stroke()}g.restore();g.restore()}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;if(state==='play')update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});c.addEventListener('pointerdown',jump);$('#play').onclick=start;$('#again').onclick=start;$('#skin').onclick=shop;$('#skin2').onclick=shop;setShop();hud();
</script></body></html>
